version: '3.9'

services:
  # === AI Core ===
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=False   # Set true + add auth in production
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama

  # === RAG & Long-term Memory ===
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - anythingllm:/app/server/storage
      - anythingllm:/app/collector/hotdir
      - anythingllm:/app/collector/outputs
    environment:
      - STORAGE_DIR=/app/server/storage

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant:/qdrant/storage

  # === Optional: Workflow + Auth ===
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n:/home/node/.n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false

volumes:
  ollama:
  open-webui:
  anythingllm:
  qdrant:
  n8n:
